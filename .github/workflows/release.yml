# Release builds with the official client pair baked in (distribution §1, §5).
#
# Two ways in, deliberately:
#   - pushing a tag `v*` builds every artifact and attaches it to a *draft*
#     GitHub Release — draft so the notes get written by a person before
#     anything is announced;
#   - workflow_dispatch builds the same artifacts and attaches nothing, so the
#     pipeline can be smoke-tested without cutting a release.
#
# The credentials arrive as repository secrets and are read at *compile* time
# by `load_config_from`'s embedded fallback (src-tauri/src/lib.rs). A fork PR
# cannot see the secrets and this workflow does not run on PRs at all.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 rather than latest: webkit2gtk-4.1 is what the app links
          # against, and older glibc keeps the AppImage runnable on more
          # distros than the runner it was built on.
          - platform: ubuntu-22.04
          - platform: macos-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: UI dependencies
        run: npm --prefix ui install

      # Build only — attaching happens after the AppImage is repaired below.
      # (tauri-action's own release upload would publish the artifact before
      # the strip step could touch it.)
      - name: Build the bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OMACAL_CLIENT_ID: ${{ secrets.OMACAL_CLIENT_ID }}
          OMACAL_CLIENT_SECRET: ${{ secrets.OMACAL_CLIENT_SECRET }}

      # The bundler ships Ubuntu's whole Wayland client stack inside the
      # AppImage. On hosts with a newer Mesa (Arch, so Omarchy itself) the
      # system EGL refuses those older libs — `EGL_BAD_PARAMETER` — and the
      # webview renders a blank window (proven on Omarchy, 2026-08-14).
      # Every desktop the AppImage can run on ships its own libwayland, so
      # remove the bundled copies and let the host's be found.
      - name: Strip bundled Wayland libraries from the AppImage
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          cd target/release/bundle/appimage
          image=$(ls *.AppImage)
          ./"$image" --appimage-extract >/dev/null
          rm -v squashfs-root/usr/lib/libwayland-*
          # The bundled Debian xdg-open shadows the host's own launcher (the
          # AppImage prepends its usr/bin to PATH) and execs the browser
          # handler directly, re-sanitising nothing — half of issue #1. The
          # host's xdg-open is the one that knows how the host opens things;
          # `browser::open_external` also filters the child's PATH, for every
          # image shipped before this line existed.
          rm -v squashfs-root/usr/bin/xdg-open
          # The GTK hook forces GDK_BACKEND=x11, guarding a WebKit-on-Wayland
          # crash (tauri#8541) that in this AppImage was the bundled libwayland
          # removed one line up. XWayland is not free either: under Hyprland's
          # xwayland:force_zero_scaling with a session GDK_SCALE, the app
          # renders at the wrong size (160% on the reference Omarchy laptop).
          # Native Wayland sizes correctly whatever GDK_SCALE says.
          sed -i 's/^export GDK_BACKEND=x11.*/# GDK_BACKEND left alone: the Wayland crash this guarded was the bundled libwayland this workflow strips./' \
            squashfs-root/apprun-hooks/linuxdeploy-plugin-gtk.sh
          if grep -q '^export GDK_BACKEND=x11' squashfs-root/apprun-hooks/*.sh; then
            echo "the x11 forcing survived" >&2
            exit 1
          fi
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 ./appimagetool squashfs-root "$image"
          rm -rf squashfs-root appimagetool
          # Re-extract the repacked image and prove the strip held.
          ./"$image" --appimage-extract >/dev/null
          if ls squashfs-root/usr/lib/libwayland-* 2>/dev/null; then
            echo "libwayland survived the repack" >&2
            exit 1
          fi
          rm -rf squashfs-root

      # The updater's trust chain, and it must run HERE — after the repack.
      # The strip step above rebuilds the AppImage with appimagetool, so any
      # signature made during bundling describes bytes that no longer exist;
      # signing is only honest about the file that actually ships. The .sig
      # is what the updater plugin verifies against the pubkey baked into
      # tauri.conf.json before it will touch the running image.
      - name: Sign the AppImage for the in-app updater
        if: startsWith(matrix.platform, 'ubuntu')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          image=$(ls target/release/bundle/appimage/*.AppImage)
          npx --yes @tauri-apps/cli@^2 signer sign "$image"
          test -s "$image.sig" || { echo "no signature was produced" >&2; exit 1; }

      # What the running app's update check reads (tauri.conf.json points at
      # this file via the release's /latest redirect). Linux x86_64 only: the
      # macOS build is unsigned by Apple and self-update there would trip
      # Gatekeeper, and every other Linux channel updates through its package
      # manager. Tag pushes only — the URL inside names the tag.
      - name: Write latest.json for the updater
        if: startsWith(matrix.platform, 'ubuntu') && startsWith(github.ref, 'refs/tags/')
        run: |
          image=$(ls target/release/bundle/appimage/*.AppImage)
          jq -n \
            --arg version "${GITHUB_REF_NAME#v}" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg sig "$(cat "$image.sig")" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$(basename "$image")" \
            '{version: $version, pub_date: $date,
              platforms: {"linux-x86_64": {signature: $sig, url: $url}}}' \
            > latest.json
          cat latest.json

      # Tag push: attach the repaired bundles to a draft release for the tag.
      # Both matrix jobs race to create it; the loser just uploads.
      - name: Attach to draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --draft --title "omacal $tag" --notes "" || true
          if [ "$RUNNER_OS" = "Linux" ]; then
            files=$(ls target/release/bundle/appimage/*.AppImage \
                       target/release/bundle/appimage/*.AppImage.sig \
                       target/release/bundle/deb/*.deb \
                       target/release/bundle/rpm/*.rpm \
                       latest.json)
          else
            files=$(ls target/release/bundle/dmg/*.dmg)
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber $files

      # The bundles are useful even from a smoke test — graded runners keep
      # them a few days, long enough to hand one to a tester.
      - name: Upload artifacts (smoke test)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: omacal-${{ matrix.platform }}
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/dmg/*.dmg
          if-no-files-found: warn
