# What a change has to survive before it lands (docs/testing-standard.md is
# what the tests themselves have to survive before they count).
#
# Deliberately NOT here:
#   - `cargo fmt --check`: this codebase does not follow rustfmt (~790 hunks
#     of hand-set comment and literal layout), and a gate nobody intends to
#     satisfy is noise. Match the style around you instead.
#   - Screenshot comparisons (`--ignore-snapshots`): the committed goldens are
#     rendered on specific machines (Arch and macOS), and Ubuntu's font stack
#     draws them a few pixels differently. Behavioural assertions all still
#     run; pixel review happens on the machines that own the baselines.

name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      # -D warnings because the tree is clippy-clean today, and the only way
      # it stays that way is a red build for the first warning.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast

  ui:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm --prefix ui ci
      - run: npm --prefix ui run check
      - name: Install Playwright browsers
        run: cd ui && npx playwright install --with-deps webkit chromium
      # One spec is skipped by name, its debt on record rather than hidden
      # in a green run: "a standalone view gets the same box the app gives
      # it" — its APP_CHROME_PX constant bakes a macOS font metric and reads
      # 1px off under Linux font rendering. When that constant is fixed,
      # delete the filter so it gates again. (The create_event specs used to
      # be here too; their cause — a form that grew past the viewport after
      # placement — was found and fixed on 2026-08-14.)
      - name: UI suite
        run: |
          cd ui && npx playwright test --ignore-snapshots \
            --grep-invert "a standalone view gets the same box the app gives it"
